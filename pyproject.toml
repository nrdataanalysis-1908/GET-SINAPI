[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "get-sinapi"
version = "0.1.0"
description = "Pipeline rastreável de dados públicos do SINAPI/CAIXA"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "NR Data Analysis" }]
dependencies = [
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "PyYAML>=6.0",
  "SQLAlchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "requests-mock>=1.12", "httpx>=0.27"]

[project.scripts]
getsinapi = "getsinapi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint.isort]
known-first-party = ["getsinapi"]
