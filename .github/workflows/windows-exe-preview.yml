name: Windows desktop preview

on:
  push:
    branches:
      - build/windows-exe-preview
    paths:
      - "desktop.py"
      - ".github/workflows/windows-exe-preview.yml"
      - "src/**"
      - "frontend/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Install Python package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller
      - name: Run backend tests
        run: python -m pytest
      - name: Package Windows application
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --noconsole --name GET-SINAPI --add-data "frontend/dist;frontend/dist" --collect-all fastapi --collect-all starlette --collect-all uvicorn --collect-all pandas --collect-all openpyxl --collect-all xlrd --collect-all sqlalchemy --collect-all requests --collect-all bs4 --collect-all yaml desktop.py
          Compress-Archive -Path "dist/GET-SINAPI/*" -DestinationPath "GET-SINAPI-Windows-Preview.zip" -Force
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: GET-SINAPI-Windows-Preview
          path: GET-SINAPI-Windows-Preview.zip
          if-no-files-found: error
          retention-days: 14
