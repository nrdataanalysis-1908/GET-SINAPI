<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
<title id="t">Arquitetura atual do GET-SINAPI Desktop</title>
<desc id="d">Aplicativo Windows inicia frontend React, API FastAPI e processamento Python local, com banco SQLite e autenticação PBKDF2 armazenada localmente.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061426"/><stop offset="1" stop-color="#0A1D33"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#087BCE"/><stop offset="1" stop-color="#60E6FF"/></linearGradient></defs>
<rect width="1200" height="430" rx="20" fill="url(#bg)"/>
<g font-family="Inter,Arial,sans-serif">
 <text x="48" y="48" fill="#60E6FF" font-size="16" font-weight="700" letter-spacing="3">ARQUITETURA DE EXECUÇÃO · 100% LOCAL</text>
 <rect x="45" y="82" width="1110" height="90" rx="14" fill="#0D2945" stroke="#087BCE" stroke-width="2"/>
 <text x="70" y="116" fill="#60E6FF" font-size="14" font-weight="700">01 / DISTRIBUIÇÃO</text>
 <text x="70" y="149" fill="#EAF7FF" font-size="25" font-weight="700">GET-SINAPI-V3.exe</text>
 <text x="425" y="120" fill="#B9D9EA" font-size="16">Launcher Windows · inicializa serviços locais</text>
 <text x="425" y="147" fill="#7FAFC9" font-size="14">Aguarda API e interface responderem antes de abrir o navegador</text>
 <path d="M600 172v34m-8-10 8 10 8-10" stroke="url(#line)" stroke-width="3" fill="none"/>
 <rect x="45" y="215" width="340" height="112" rx="12" fill="#0D2945" stroke="#21D4FD" stroke-width="2"/>
 <text x="68" y="247" fill="#60E6FF" font-size="14" font-weight="700">02 / INTERFACE</text>
 <text x="68" y="281" fill="#EAF7FF" font-size="27" font-weight="700">React + Vite</text>
 <text x="68" y="307" fill="#A9C8DA" font-size="14">Dashboard · consultas · orçamento</text>
 <rect x="430" y="215" width="340" height="112" rx="12" fill="#0D2945" stroke="#087BCE" stroke-width="2"/>
 <text x="453" y="247" fill="#60E6FF" font-size="14" font-weight="700">03 / SERVIÇOS</text>
 <text x="453" y="281" fill="#EAF7FF" font-size="27" font-weight="700">FastAPI + Python</text>
 <text x="453" y="307" fill="#A9C8DA" font-size="14">API · cálculos · ingestão · validação</text>
 <rect x="815" y="215" width="340" height="112" rx="12" fill="#0D2945" stroke="#21D4FD" stroke-width="2"/>
 <text x="838" y="247" fill="#60E6FF" font-size="14" font-weight="700">04 / PERSISTÊNCIA E ACESSO</text>
 <text x="838" y="281" fill="#EAF7FF" font-size="27" font-weight="700">SQLite local</text>
 <text x="838" y="307" fill="#A9C8DA" font-size="14">Dados SINAPI · users.json · PBKDF2</text>
 <path d="M385 270h45m-10-8 10 8-10 8M770 270h45m-10-8 10 8-10 8" stroke="url(#line)" stroke-width="3" fill="none"/>
 <text x="48" y="374" fill="#60E6FF" font-size="14" font-weight="700">MODELO ATUAL</text>
 <text x="48" y="400" fill="#A9C8DA" font-size="14">Autenticação e dados são locais por instalação. Não há contas centralizadas nem sincronização entre computadores.</text>
</g></svg>